<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Report · RoadClear Oman</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --carbon: #0A0A0B;
    --red: #FF3E3E;
    --red-dim: rgba(255, 62, 62, 0.12);
    --white: #FFFFFF;
    --panel: #111113;
    --border: #1E1E22;
    --dim: #888888;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--carbon);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem 1rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 2.5rem;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--red);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 1.8rem;
    letter-spacing: -0.01em;
  }

  .form-group {
    margin-bottom: 1.2rem;
  }

  label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  input[type="text"], input[type="tel"] {
    width: 100%;
    background: #060608;
    border: 1px solid var(--border);
    padding: 0.8rem 1rem;
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, input[type="tel"]:focus {
    border-color: var(--red);
  }

  .file-drop {
    background: #060608;
    border: 1.5px dashed var(--border);
    padding: 1.2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .file-drop:hover {
    border-color: var(--red);
  }

  input[type="file"] {
    display: none;
  }

  .file-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--dim);
    cursor: pointer;
  }

  .btn-submit {
    width: 100%;
    margin-top: 1.5rem;
    padding: 1rem;
    background: var(--red);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-submit:hover {
    background: #e03232;
  }

  .back-link {
    display: inline-block;
    margin-top: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    color: var(--dim);
    text-decoration: none;
    text-transform: uppercase;
  }

  .back-link:hover { color: var(--red); }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">SYS // 02 · Street Report</div>
    <h1>File Report</h1>

    <form action="/api/report-vehicle" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="fullName">Reporter Name</label>
        <input type="text" id="fullName" name="fullName" required placeholder="e.g. Salim Al-Harthy">
      </div>

      <div class="form-group">
        <label for="phone">Civil ID / Phone</label>
        <input type="tel" id="phone" name="phone" required placeholder="+968 9000 0000">
      </div>

      <div class="form-group">
        <label>Vehicle Evidence</label>
        <div class="file-drop" onclick="document.getElementById('vehicleImage').click()">
          <span class="file-label" id="fileNameText">📷 Click to upload photo</span>
          <input type="file" id="vehicleImage" name="vehicleImage" accept="image/*" required onchange="updateFileName(this)">
        </div>
      </div>

      <button type="submit" class="btn-submit">⬡ Dispatch to ROP Pipeline</button>
    </form>

    <a href="/" class="back-link">← Return to Main Grid</a>
  </div>

  <script>
    function updateFileName(input) {
      if (input.files && input.files[0]) {
        document.getElementById('fileNameText').innerText = "SELECTED: " + input.files[0].name;
      }
    }
  </script>

</body>
</html>
